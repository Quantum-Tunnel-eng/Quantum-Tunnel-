async function H(s){if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'f'+h}

`<section style="background:radial-gradient(circle at 12% 25%,#C7D2FF 0,transparent 45%),radial-gradient(circle at 90% 10%,#B6F1E8 0,transparent 40%),#F4F6FF;padding:56px 0 72px"><div class="w" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;align-items:center"><div><span style="display:inline-block;background:#fff;border:1px solid #D5DAF5;border-radius:99px;padding:6px 16px;font-weight:700;font-size:14px;color:#3B2FD0">Quant · Reasoning · Geometry · DI</span><h1 style="font-size:clamp(38px,6vw,64px);line-height:1.05;font-weight:800;margin:20px 0">Make Every Mock <span style="background:linear-gradient(90deg,#3B2FD0,#0E9F92);-webkit-background-clip:text;background-clip:text;color:transparent">Count!</span></h1><p style="font-size:20px;color:#3F4670;max-width:540px;margin:0 0 28px">Timed aptitude mocks, step-by-step solutions and sharp performance reports. Practise, measure and climb the rank list.</p><a class="btn" href="#/mocks" style="padding:14px 26px">Start Practising</a>${u?'':'<a class="btn o" href="#/register" style="padding:14px 26px">Create Student Account</a>'}</div>

if(p=='account')return ap(`${T('Account & security')}<div class="card" style="max-width:420px"><p>Signed in as <b>${esc(u.n)}</b> (administrator)</p>${field('cp','Current password','password')}${field('cn','New password','password')}${field('cc','Confirm new password','password')}<p id="e" class="err" role="alert"></p><button class="btn" onclick="doChg()">Change password</button></div><div class="card" style="max-width:420px;margin-top:20px"><h3>Administrator email</h3><p class="mu">One-time login codes are sent here. Current: ${u.em?esc(u.em):'not set'}</p>${field('em_e','Email address','email')}${field('em_p','Current password','password')}<p id="e2" class="err" role="alert"></p><button class="btn" onclick="saveEm()">Save email</button></div>`);
ap('<div class="card">Section not found.</div>')}
function stDraw(){const q=$('#sq').value.trim().toLowerCase(),f=$('#sf').value,L=D.users.filter(x=>x.r!='admin'&&x.k.includes(q)&&(!f||(f=='s'?x.sus:!x.sus)));$('#st').innerHTML=L.length?`<table><tr><th>Username</th><th>Registered</th><th>Status</th><th>Attempts</th><th>Last activity</th><th>Actions</th></tr>${L.map(x=>{const A=myAtt(x);return`<tr><td>${esc(x.n)}</td><td>${x.t?dt(x.t):'—'}</td><td>${x.sus?'<span class="err">Suspended</span>':'Active'}</td><td>${A.length}</td><td>${A.length?dt(Math.max(...A.map(a=>a.end))):'—'}</td><td><a class="btn o" href="#/admin/student/${x.k}">History</a><button class="btn o" onclick="sus('${x.k}')">${x.sus?'Reactivate':'Suspend'}</button><button class="btn o" onclick="rev('${x.k}')">Revoke sessions</button></td></tr>`}).join('')}</table>`:'No students found.'}
function sus(k){const x=D.users.find(z=>z.k==k);x.sus=!x.sus;if(x.sus)x.v++;audit(user().n,(x.sus?'suspended ':'reactivated ')+x.n);save();stDraw()}
function rev(k){const x=D.users.find(z=>z.k==k);x.v++;audit(user().n,'revoked sessions of '+x.n);save();stDraw()}
function rsList(){const m=$('#rm').value,q=$('#rq').value.trim().toLowerCase(),f=$('#rf').value?new Date($('#rf').value).getTime():0,t=$('#rt').value?new Date($('#rt').value).getTime()+864e5:1e15;return D.attempts.filter(a=>a.sub&&(!m||a.m==m)&&a.u.includes(q)&&a.end>=f&&a.end<t).map(a=>({a,r:calc(a)}))}
function rsDraw(){const L=rsList(),s=L.map(x=>x.r.sc),m=$('#rm').value,st=D.attempts.filter(a=>!m||a.m==m).length,ac=L.filter(x=>x.r.c+x.r.w).map(x=>acc(x.r)),d=dist(L.map(x=>x.r)),K=(v,l)=>`<div class="card"><div class="big">${v}</div>${l}</div>`,f=n=>s.length?n:'—';
$('#rs').innerHTML=`<div class="grid">${K(L.length,'Submissions')}${K(f((s.reduce((a,b)=>a+b,0)/s.length).toFixed(1)),'Mean score')}${K(f(med(s)),'Median score')}${K(f(Math.max(...s)),'Highest')}${K(f(Math.min(...s)),'Lowest')}${K(ac.length?Math.round(ac.reduce((a,b)=>a+b,0)/ac.length*100)+'%':'—','Average accuracy')}${K(st?Math.round(L.length/st*100)+'%':'—','Completion rate')}</div><div class="card" style="margin-top:16px"><h3>Score distribution</h3>${DL.map((l,i)=>hb(l,d[i],Math.max(1,...d),'#3B2FD0')).join('')}</div><div class="card tb" style="margin-top:16px"><button class="btn" onclick="rsCsv()">Export CSV</button>${L.length?`<table><tr><th>Student</th><th>Mock</th><th>Score</th><th>Accuracy</th><th>Time</th><th>Date</th></tr>${L.map(x=>`<tr><td>${esc(x.a.u)}</td><td>${esc(x.r.m.title)}</td><td>${x.r.sc}/${x.r.mx}</td><td>${pct(x.r)}</td><td>${tm(x.r.t)}</td><td>${dt(x.a.end)}</td></tr>`).join('')}</table>`:'<p>No matching results.</p>'}</div>`}
const rsCsv=()=>dl('results',[['username','mock','score','max','accuracy','time','submitted']].concat(rsList().map(x=>[x.a.u,'"'+x.r.m.title.replace(/"/g,'""')+'"',x.r.sc,x.r.mx,pct(x.r),tm(x.r.t),new Date(x.a.end).toISOString()])));
async function doChg(){const u=user(),e=$('#e'),n=$('#cn').value;if(await H(u.s+$('#cp').value)!=u.p)return e.textContent='Current password is incorrect.';if(!PW.test(n))return e.textContent='Password needs 7+ characters with a letter, a number and a special character such as # @ £ _ & * - / ! ? $ € ¥ ¢ % ^ (no spaces).';if(n!=$('#cc').value)return e.textContent='Passwords do not match.';u.p=await H(u.s+n);u.v++;audit(u.n,'changed password');save();localStorage.bqt_s=u.k+'|'+u.v;e.className='ok';e.textContent='Password changed.'}
function newMock(){const id=uid();D.mocks.push({id,title:'Untitled mock',cat:'Aptitude',desc:'',dur:D.set.dur,pos:D.set.pos,neg:D.set.neg,tgt:D.set.tgt,st:'draft',qs:[]});audit(user().n,'created mock '+id);save();go('#/admin/mock/'+id)}
function check(m){const e=[];if(!m.title.trim())e.push('Title required');if(m.dur<1||m.pos<=0||m.neg<0)e.push('Check duration and marks');if(!m.qs.length||m.qs.length!=m.tgt)e.push(`Needs exactly ${m.tgt} questions (has ${m.qs.length})`);
m.qs.forEach((q,i)=>{geoErr(q.gm,'Question '+(i+1)+' diagram').concat(geoErr(q.sg,'Question '+(i+1)+' solution diagram')).forEach(x=>e.push(x));if(!q.q.trim()&&!q.qi&&!q.ds&&!q.gm)e.push('Question '+(i+1)+' has no text, image or chart');if(q.o.some((o,j)=>!o.trim()&&!(q.oi&&q.oi[j])))e.push('Question '+(i+1)+': every option needs text or an image')});(m.ds||[]).forEach(d=>parseCh(d).e.forEach(x=>e.push('Chart "'+d.name+'": '+x)));return e}
function setSt(id,st){const m=D.mocks.find(x=>x.id==id);if(st=='published'){const e=check(m);if(e.length)return alert(e.join('\n'))}m.st=st;audit(user().n,st+' mock '+m.title);save();R();if(st=='published')shareMock(id)}
function csv(id){const m=D.mocks.find(x=>x.id==id),rows=[['username','score','correct','incorrect','unanswered','time']].concat(ranked(id).map(b=>[b.x.u,b.r.sc,b.r.c,b.r.w,b.r.un,fmt(b.r.t)])),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));l.download=m.title.replace(/\W+/g,'_')+'.csv';l.click()}
let EID='';
const imgF=(i,key,j,label,val)=>`<div style="margin:8px 0"><label for="f${key}${i}_${j}">${label}</label>${val?`<img src="${val}" alt="" style="max-width:220px;max-height:140px;display:block;margin:6px 0;border-radius:8px;border:1px solid #E1E4F5"><button class="btn o" onclick="rmImg(${i},'${key}',${j})">Remove image</button>`:''}<input id="f${key}${i}_${j}" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="pickImg(this,${i},'${key}',${j})"></div>`;
const dsBlock=(d,k,lk)=>`<div class="card" style="margin-top:14px"><b>Chart ${k+1}</b> ${lk?'':`<button class="btn r" onclick="rmDs(${k})">Remove</button>`}<div class="grid"><div>${field('dn'+k,'Chart name','text','value="'+esc(d.name)+'"')}</div><div><label for="dt${k}">Chart type</label><select id="dt${k}">${CT.map(t=>`<option value="${t[0]}" ${d.type==t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div><div>${field('dh'+k,'Chart title','text','value="'+esc(d.title)+'"')}</div></div><label for="dx${k}">Passage or caselet text (optional)</label><textarea id="dx${k}" rows="2">${esc(d.txt)}</textarea>${field('dl'+k,'Labels, comma-separated (for example 2022, 2023, 2024)','text','value="'+esc(d.labels)+'"')}${d.series.map((s,j)=>`<div class="grid"><div>${field('sn'+k+'_'+j,'Series '+(j+1)+' name','text','value="'+esc(s.n)+'"')}</div><div>${field('sv'+k+'_'+j,'Values, comma-separated','text','value="'+esc(s.v)+'"')}</div></div>${lk||d.series.length<2?'':`<button class="btn o" onclick="rmSer(${k},${j})">Remove series ${j+1}</button>`}`).join('')}<p>${lk?'':`<button class="btn o" onclick="addSer(${k})">+ Add series</button>`}<button class="btn o" onclick="collect(EID);save();R()">Update preview</button></p><div>${chartHTML(d)}</div></div>`;
function edit(id){AP='manage';EID=id;const m=D.mocks.find(x=>x.id==id);if(!m)return ap('<div class="card">Not found.</div>');m.ds=m.ds||[];const lk=D.attempts.some(a=>a.m==id),dis=lk?'disabled':'';
ap(`<h1 style="margin:0 0 20px;font-size:30px;font-weight:800">Edit mock</h1>${lk?'<p class="err">This mock has attempts: timing, scoring and question count are locked. Answer-key corrections are logged and rescore all results.</p>':''}<div class="card"><div class="grid">
<div>${field('mt','Title','text','value="'+esc(m.title)+'"')}</div><div>${field('mc','Category','text','value="'+esc(m.cat)+'"')}</div><div>${field('md','Duration (min)','number','min=1 value='+m.dur+' '+dis)}</div><div>${field('mp','Marks per correct','number','min=1 value='+m.pos+' '+dis)}</div><div>${field('mn','Marks lost per incorrect','number','min=0 value='+m.neg+' '+dis)}</div><div>${field('mg','Target questions','number','min=1 value='+m.tgt+' '+dis)}</div></div><label for="mx">Description</label><textarea id="mx">${esc(m.desc)}</textarea><p class="mu">Maximum marks: ${m.qs.length*m.pos}</p></div>
<h2 style="margin-top:28px">Data interpretation charts</h2><p class="mu">Build bar, line or pie charts, then attach any chart to one or more questions below.</p>${m.ds.map((d,k)=>dsBlock(d,k,lk)).join('')}${lk?'':'<p><button class="btn o" onclick="addDs()">+ Add chart</button></p>'}
<h2 style="margin-top:28px">Questions</h2>${m.qs.map((q,i)=>`<div class="card" style="margin-top:14px"><span style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#3B2FD0;color:#fff;font-weight:800;margin-right:8px">${i+1}</span><b>Question</b> ${lk?'':`<button class="btn r" onclick="rmq('${id}',${i})">Remove</button>`}
<label for="q${i}">Question text (type it, add an image, or both)</label><textarea id="q${i}" rows="3">${esc(q.q)}</textarea>${imgF(i,'qi',0,'Question image (optional)',q.qi)}${geoF(i,'gm','g',q.gm,'Geometry diagram for the question (optional)')}
<label for="d${i}">Attached chart (optional)</label><select id="d${i}"><option value="">None</option>${m.ds.map(d=>`<option value="${d.id}" ${q.ds==d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
<label for="c${i}">Category</label><input id="c${i}" value="${esc(q.c)}">
${q.o.map((o,j)=>`<label for="o${i}_${j}">Option ${'ABCD'[j]} (text and/or image)</label><input id="o${i}_${j}" value="${esc(o)}">${imgF(i,'oi',j,'Option '+'ABCD'[j]+' image (optional)',q.oi&&q.oi[j])}`).join('')}
<label for="a${i}">Correct answer</label><select id="a${i}">${'ABCD'.split('').map((l,j)=>`<option value="${j}" ${q.a==j?'selected':''}>${l}</option>`).join('')}</select>
<label for="s${i}">Solution (type it, add an image, or both)</label><textarea id="s${i}" rows="3">${esc(q.s)}</textarea>${imgF(i,'si',0,'Solution image (optional)',q.si)}${geoF(i,'sg','x',q.sg,'Geometry diagram for the solution (optional)')}</div>`).join('')}
<p style="margin-top:16px">${lk?'':`<button class="btn o" onclick="addq('${id}')">+ Add question</button>`}<button class="btn" onclick="saveM('${id}')">Save draft</button><a class="btn o" href="#/admin/preview/${id}" onclick="collect('${id}');save()">Preview Mock</a><a class="btn o" href="#/admin/manage">Back</a></p><p id="e" class="ok" role="status"></p>`)}
function collect(id){const m=D.mocks.find(x=>x.id==id);m.title=$('#mt').value;m.cat=$('#mc').value;m.desc=$('#mx').value;if(!$('#md').disabled){m.dur=+$('#md').value;m.pos=+$('#mp').value;m.neg=+$('#mn').value;m.tgt=+$('#mg').value}
(m.ds||[]).forEach((d,k)=>{d.name=$('#dn'+k).value;d.type=$('#dt'+k).value;d.title=$('#dh'+k).value;d.txt=$('#dx'+k).value;d.labels=$('#dl'+k).value;d.series.forEach((s,j)=>{s.n=$(`#sn${k}_${j}`).value;s.v=$(`#sv${k}_${j}`).value})});
m.qs.forEach((q,i)=>{[['gm','g'],['sg','x']].forEach(([f,pf])=>{const t=$(`#${pf}t${i}`).value;q[f]=t?{t,d:Object.fromEntries(SH[t].map(([k])=>[k,($(`#${pf}d${i}_${k}`)||{}).value||'']))}:null});q.q=$('#q'+i).value;q.c=$('#c'+i).value;q.ds=$('#d'+i).value;q.o=[0,1,2,3].map(j=>$(`#o${i}_${j}`).value);q.a=+$('#a'+i).value;q.s=$('#s'+i).value});return m}
function saveM(id){const m=collect(id),w=check(m).filter(x=>x.startsWith('Chart'));audit(user().n,'saved mock '+m.title);save();const e=$('#e');e.className=w.length?'err':'ok';e.textContent=w.length?'Saved, but fix before publishing: '+w.join(' '):'Saved.'}
function pickImg(el,i,key,j){const f=el.files[0];if(!f)return;if(!/^image\/(png|jpe?g|webp|gif)$/.test(f.type)||f.size>5e6)return alert('Choose a PNG, JPG, WebP or GIF image under 5 MB.');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const m=collect(EID),u=c.toDataURL('image/jpeg',.82);if(key=='oi'){m.qs[i].oi=m.qs[i].oi||['','','',''];m.qs[i].oi[j]=u}else m.qs[i][key]=u;try{save()}catch(e){alert('Browser storage is full. Remove some images or use smaller ones.');D=JSON.parse(localStorage.bqt)}R()};im.src=r.result};r.readAsDataURL(f)}
function rmImg(i,key,j){const m=collect(EID);if(key=='oi')m.qs[i].oi[j]='';else m.qs[i][key]='';save();R()}
function addDs(){const m=collect(EID);m.ds.push({id:uid(),name:'Chart '+(m.ds.length+1),type:'bar',title:'',txt:'',labels:'A, B, C',series:[{n:'Series 1',v:'10, 20, 30'}]});save();R()}
function rmDs(k){const m=collect(EID),id=m.ds[k].id;m.ds.splice(k,1);m.qs.forEach(q=>{if(q.ds==id)q.ds=''});save();R()}
function addSer(k){const m=collect(EID);m.ds[k].series.push({n:'Series '+(m.ds[k].series.length+1),v:''});save();R()}
function rmSer(k,j){const m=collect(EID);m.ds[k].series.splice(j,1);save();R()}
function pv(id){AP='manage';const m=D.mocks.find(x=>x.id==id);if(!m)return ap('<div class="card">Not found.</div>');ap(`<h1 style="margin:0 0 6px;font-size:30px;font-weight:800">Preview: ${esc(m.title)}</h1><p class="mu">This is how students will see each question. Correct answers and solutions are shown for checking.</p>${m.qs.map((q,i)=>`<div class="card" style="margin-bottom:16px"><b>Question ${i+1}</b><p style="font-size:20px;white-space:pre-wrap">${esc(q.q)}</p>${qMedia(m,q)}${q.o.map((t,j)=>`<div class="opt ${j==q.a?'good':''}"><span class="ol">${'ABCD'[j]}</span><span>${esc(t)}${oImg(q,j)}${j==q.a?' <b>✔ Correct</b>':''}</span></div>`).join('')}<div style="background:#E9F8F5;border-radius:14px;padding:16px"><b>Solution:</b> ${q.s&&q.s.trim()?esc(q.s):q.si||q.sg?'':'None provided'}${sMedia(q)}</div></div>`).join('')||'<div class="card">No questions yet.</div>'}<a class="btn" href="#/admin/mock/${id}">Back to editor</a>`)}
function addq(id){collect(id).qs.push({q:'',o:['','','',''],a:0,s:'',c:''});save();R()}
function rmq(id,i){collect(id).qs.splice(i,1);save();R()}
R();
</script></body></html>
